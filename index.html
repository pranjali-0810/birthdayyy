<script>
        /* -----------------------------------------------------------
           1. STATE & INITIAL DATA
        ----------------------------------------------------------- */
        let replacingPhotoIndex = null;
        let currentSpotlightIndex = 0;

        const defaultState = {
            boyName: "My Boy",
            boyAge: "",
            heroMessage: "Watching you grow, laugh, and explore the world is the greatest gift of all. May your day be packed with big adventures, endless smiles, and every dream you wish for!",
            candlesLit: [true, true, true, true, true],
            amazingCards: [
                {
                    title: "Your Big, Kind Heart",
                    icon: "fa-heart",
                    gradient: "from-rose-500 via-pink-500 to-orange-500",
                    border: "border-rose-300",
                    message: "The way you care about people, animals, and making everyone around you feel included makes the whole world brighter."
                },
                {
                    title: "Your Endless Curiosity",
                    icon: "fa-rocket",
                    gradient: "from-cyan-400 via-sky-500 to-blue-600",
                    border: "border-sky-300",
                    message: "Never stop asking 'why' and 'how'! Your imagination and excitement to learn new things inspire everyone who knows you."
                },
                {
                    title: "Your Courage & Bravery",
                    icon: "fa-shield-halved",
                    gradient: "from-amber-400 via-orange-500 to-red-500",
                    border: "border-amber-300",
                    message: "Even when something feels brand new or challenging, you step up with determination and give it your very best shot."
                },
                {
                    title: "Your Infectious Laugh",
                    icon: "fa-face-laugh-beam",
                    gradient: "from-emerald-400 via-teal-500 to-cyan-600",
                    border: "border-emerald-300",
                    message: "One smile or joke from you can turn an ordinary afternoon into the best memory of the entire week."
                },
                {
                    title: "Your Creative Mind",
                    icon: "fa-palette",
                    gradient: "from-fuchsia-500 via-purple-500 to-indigo-600",
                    border: "border-fuchsia-300",
                    message: "Whether you're building, drawing, storytelling, or inventing games, you bring pure magic to everything you create."
                },
                {
                    title: "Simply Being You",
                    icon: "fa-crown",
                    gradient: "from-yellow-400 via-amber-500 to-pink-500",
                    border: "border-yellow-300",
                    message: "You don't ever have to pretend to be anyone else—just being yourself is more than enough to make us endlessly proud."
                }
            ],
            memories: [
                {
                    id: 1,
                    isStarter: true,
                    starterGradient: "from-rose-400 via-orange-300 to-amber-300",
                    starterIcon: "fa-sun",
                    starterTitle: "Add Photo #1",
                    image: "https://images.unsplash.com/photo-1513151233558-d860c5398176?auto=format&fit=crop&w=800&q=80",
                    fallback: "https://placehold.co/600x500/FF4D6D/FFFFFF?text=Big+Adventures",
                    caption: "Chasing big dreams & sunny skies!",
                    date: "Click photo to replace",
                    rotation: "-rotate-2",
                    tapeColor: "bg-rose-400/85",
                    borderColor: "border-rose-300"
                },
                {
                    id: 2,
                    isStarter: true,
                    starterGradient: "from-sky-400 via-cyan-300 to-emerald-300",
                    starterIcon: "fa-cake-candles",
                    starterTitle: "Add Photo #2",
                    image: "https://images.unsplash.com/photo-1530103862676-de8c9debad1d?auto=format&fit=crop&w=800&q=80",
                    fallback: "https://placehold.co/600x500/00D4FF/1E1B4B?text=Pure+Joy",
                    caption: "Celebrations, laughter & pure joy",
                    date: "Click photo to replace",
                    rotation: "rotate-1",
                    tapeColor: "bg-sky-400/85",
                    borderColor: "border-sky-300"
                },
                {
                    id: 3,
                    isStarter: true,
                    starterGradient: "from-fuchsia-400 via-purple-300 to-amber-300",
                    starterIcon: "fa-rocket",
                    starterTitle: "Add Photo #3",
                    image: "https://images.unsplash.com/photo-1502086223501-7ea6ecd79368?auto=format&fit=crop&w=800&q=80",
                    fallback: "https://placehold.co/600x500/FACC15/1E1B4B?text=Unstoppable+Spirit",
                    caption: "Always exploring new horizons",
                    date: "Click photo to replace",
                    rotation: "-rotate-1",
                    tapeColor: "bg-amber-400/85",
                    borderColor: "border-amber-300"
                }
            ]
        };

        const state = window.__BAKED_BIRTHDAY_STATE__ ? JSON.parse(JSON.stringify(window.__BAKED_BIRTHDAY_STATE__)) : defaultState;

        /* -----------------------------------------------------------
           2. TOAST NOTIFICATION HELPER
        ----------------------------------------------------------- */
        let toastTimeout;
        function showToast(message, iconClass = "fa-sparkles") {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').textContent = message;
            document.getElementById('toastIcon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;

            toast.classList.remove('translate-y-24', 'opacity-0');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
            }, 3500);
        }

        /* -----------------------------------------------------------
           3. PERSONALIZATION MODAL & DOM SYNC
        ----------------------------------------------------------- */
        function openPersonalizeModal() {
            document.getElementById('inputBoyName').value = state.boyName === "My Boy" ? "" : state.boyName;
            document.getElementById('inputBoyAge').value = state.boyAge;
            document.getElementById('inputHeroMessage').value = state.heroMessage;

            const modal = document.getElementById('personalizeModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closePersonalizeModal() {
            const modal = document.getElementById('personalizeModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function savePersonalization(e) {
            e.preventDefault();
            const rawName = document.getElementById('inputBoyName').value.trim();
            const rawAge = document.getElementById('inputBoyAge').value.trim();
            const rawMsg = document.getElementById('inputHeroMessage').value.trim();

            state.boyName = rawName || "My Boy";
            state.boyAge = rawAge;
            if (rawMsg) state.heroMessage = rawMsg;

            syncPersonalizationUI();
            closePersonalizeModal();
            triggerConfettiBurst(0.5, 0.3, 95);
            showToast(`Updated celebration page for ${state.boyName}!`, "fa-wand-magic-sparkles");
        }

        function syncPersonalizationUI() {
            document.getElementById('displayBoyName').textContent = state.boyName + "!";
            document.getElementById('footerBoyName').textContent = state.boyName;
            document.getElementById('displayHeroMessage').textContent = state.heroMessage;
            document.getElementById('cakeNameTag').textContent = state.boyName.toUpperCase().slice(0, 14);

            const agePill = document.getElementById('agePillContainer');
            if (state.boyAge) {
                document.getElementById('displayBoyAge').textContent = state.boyAge;
                document.getElementById('heroBadgeText').textContent = `Celebrating ${state.boyName}'s Big Day!`;
                agePill.classList.remove('hidden');
            } else {
                document.getElementById('heroBadgeText').textContent = `Celebrating Your Special Day!`;
                agePill.classList.add('hidden');
            }
        }

        function relightAllCandles() {
            state.candlesLit = [true, true, true, true, true];
            renderCandles();
            document.getElementById('wishGrantedBanner').classList.add('hidden');
            document.getElementById('blowAllBtn').classList.remove('hidden');
            document.getElementById('relightBtn').classList.add('hidden');
            document.getElementById('cakeAmbientGlow').classList.remove('opacity-20');
            showToast("Candles relit! Ready for another wish.", "fa-fire");
        }

        function checkAllCandlesStatus() {
            const allOut = state.candlesLit.every(lit => !lit);
            if (allOut) {
                document.getElementById('wishGrantedBanner').classList.remove('hidden');
                document.getElementById('blowAllBtn').classList.add('hidden');
                document.getElementById('relightBtn').classList.remove('hidden');
                document.getElementById('cakeAmbientGlow').classList.add('opacity-20');

                triggerConfettiBurst(0.25, 0.5, 90);
                setTimeout(() => triggerConfettiBurst(0.75, 0.5, 90), 250);
                setTimeout(() => triggerConfettiBurst(0.5, 0.35, 130), 500);
                playCelebrationChord();
            }
        }

        /* -----------------------------------------------------------
           4. INTERACTIVE CANDLE CAKE LOGIC
        ----------------------------------------------------------- */
        function renderCandles() {
            const row = document.getElementById('candlesRow');
            if (!row) return;
            row.innerHTML = '';

            const candleColors = [
                'from-rose-400 to-rose-600',
                'from-sky-400 to-blue-600',
                'from-amber-300 to-orange-500',
                'from-emerald-400 to-teal-600',
                'from-fuchsia-400 to-purple-600'
            ];

            state.candlesLit.forEach((isLit, index) => {
                const wrapper = document.createElement('div');
                wrapper.className = "flex flex-col items-center cursor-pointer group relative";
                wrapper.onclick = () => blowSingleCandle(index);
                wrapper.title = isLit ? "Tap to blow out candle" : "Candle blown out!";

                wrapper.innerHTML = `
                    <div id="smoke-${index}" class="h-6 flex items-end justify-center pointer-events-none"></div>
                    <div id="flame-${index}" class="candle-flame w-4 h-6 sm:w-5 sm:h-7 mb-0.5 ${isLit ? 'animate-flicker' : 'extinguished'}"></div>
                    <div class="w-0.5 h-2 bg-slate-700"></div>
                    <div class="w-3.5 sm:w-4 h-12 sm:h-14 rounded-t-md bg-gradient-to-b ${candleColors[index % candleColors.length]} shadow-md relative overflow-hidden border-x border-white/40 group-hover:scale-105 transition-transform">
                        <div class="w-full h-1.5 bg-white/50 mt-2 -rotate-12"></div>
                        <div class="w-full h-1.5 bg-white/50 mt-3 -rotate-12"></div>
                        <div class="w-full h-1.5 bg-white/50 mt-3 -rotate-12"></div>
                    </div>
                `;
                row.appendChild(wrapper);
            });
        }

        function spawnSmoke(index) {
            const smokeContainer = document.getElementById(`smoke-${index}`);
            if (!smokeContainer) return;
            const wisp = document.createElement('div');
            wisp.className = "w-2.5 h-2.5 rounded-full bg-slate-400/70 blur-[2px] smoke-wisp";
            smokeContainer.appendChild(wisp);
            setTimeout(() => wisp.remove(), 2200);
        }

        function blowSingleCandle(index) {
            if (!state.candlesLit[index]) return;
            state.candlesLit[index] = false;

            const flame = document.getElementById(`flame-${index}`);
            if (flame) {
                flame.classList.remove('animate-flicker');
                flame.classList.add('extinguished');
            }
            spawnSmoke(index);
            playSoftPuffSound();
            checkAllCandlesStatus();
        }

        function blowOutAllCandles() {
            state.candlesLit.forEach((lit, idx) => {
                if (lit) {
                    setTimeout(() => blowSingleCandle(idx), idx * 120);
                }
            });
        }

        /* -----------------------------------------------------------
           5. "REASONS YOU'RE AMAZING" FLIP CARDS & CUSTOM NOTES
        ----------------------------------------------------------- */
        function renderAmazingCards() {
            const grid = document.getElementById('amazingCardsGrid');
            if (!grid) return;
            grid.innerHTML = '';

            state.amazingCards.forEach((card) => {
                const cardEl = document.createElement('div');
                cardEl.className = "flip-card h-64 perspective-1000 cursor-pointer select-none";
                cardEl.onclick = function() {
                    this.classList.toggle('flipped');
                };

                const borderClass = card.border || "border-amber-300";

                cardEl.innerHTML = `
                    <div class="relative w-full h-full transform-style-3d">
                        <div class="absolute inset-0 backface-hidden rounded-3xl bg-white/95 border-2 ${borderClass} p-6 flex flex-col items-center justify-center text-center shadow-lg hover:scale-[1.02] transition-transform">
                            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br ${card.gradient} flex items-center justify-center text-white text-2xl shadow-md mb-4">
                                <i class="fa-solid ${card.icon}"></i>
                            </div>
                            <h3 class="font-display text-xl font-bold text-indigo-950 mb-2">${card.title}</h3>
                            <span class="text-xs font-extrabold text-rose-500 flex items-center gap-1.5 mt-2">
                                <i class="fa-solid fa-rotate"></i> Tap to read note
                            </span>
                        </div>

                        <div class="absolute inset-0 backface-hidden rotate-y-180 rounded-3xl bg-gradient-to-br ${card.gradient} p-6 flex flex-col items-center justify-center text-center shadow-xl text-white border-2 border-white/60">
                            <i class="fa-solid fa-quote-left text-white/40 text-2xl mb-2"></i>
                            <p class="text-base sm:text-lg font-semibold leading-relaxed drop-shadow-sm">
                                "${card.message}"
                            </p>
                            <span class="mt-4 text-xs font-extrabold uppercase tracking-wider text-white/95">
                                — Happy Birthday!
                            </span>
                        </div>
                    </div>
                `;
                grid.appendChild(cardEl);
            });
        }

        function openAddNoteModal() {
            const modal = document.getElementById('addNoteModal');
            if (!modal) return;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeAddNoteModal() {
            const modal = document.getElementById('addNoteModal');
            if (!modal) return;
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function addCustomAmazingCard(e) {
            e.preventDefault();
            const titleInput = document.getElementById('inputCardTitle');
            const noteInput = document.getElementById('inputCardNote');
            const title = titleInput.value.trim();
            const message = noteInput.value.trim();
            if (!title || !message) return;

            const palettes = [
                { icon: "fa-star", gradient: "from-rose-500 via-pink-500 to-orange-500", border: "border-rose-300" },
                { icon: "fa-sparkles", gradient: "from-sky-400 via-blue-500 to-indigo-600", border: "border-sky-300" },
                { icon: "fa-sun", gradient: "from-amber-400 via-orange-500 to-rose-500", border: "border-amber-300" },
                { icon: "fa-gem", gradient: "from-emerald-400 via-teal-500 to-cyan-600", border: "border-emerald-300" },
                { icon: "fa-bolt", gradient: "from-fuchsia-500 via-purple-500 to-indigo-600", border: "border-fuchsia-300" }
            ];
            const style = palettes[state.amazingCards.length % palettes.length];

            state.amazingCards.push({
                title,
                message,
                icon: style.icon,
                gradient: style.gradient,
                border: style.border
            });

            titleInput.value = '';
            noteInput.value = '';
            closeAddNoteModal();
            renderAmazingCards();
            triggerConfettiBurst(0.5, 0.5, 70);
            showToast("Added your colorful custom note card!", "fa-heart");
        }

        /* -----------------------------------------------------------
           6. PHOTO SCRAPBOOK, MULTI-UPLOAD, REPLACE, DELETE & SPOTLIGHT
        ----------------------------------------------------------- */
        function renderScrapbook() {
            const grid = document.getElementById('scrapbookGrid');
            if (!grid) return;
            grid.innerHTML = '';

            state.memories.forEach((item, index) => {
                const polaroid = document.createElement('div');
                const tape = item.tapeColor || "bg-amber-400/85";
                const border = item.borderColor || "border-amber-300";

                polaroid.className = `bg-white text-indigo-950 p-4 pb-6 rounded-2xl border-4 ${border} shadow-xl transform ${item.rotation} hover:rotate-0 hover:scale-[1.02] transition-all duration-300 relative group`;

                polaroid.innerHTML = `
                    <div class="absolute -top-3.5 left-1/2 -translate-x-1/2 w-24 h-6 ${tape} backdrop-blur-sm rounded-sm shadow-sm -rotate-1 z-10"></div>

                    <div class="absolute top-6 right-6 z-20 flex items-center gap-1.5 opacity-95 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                        <button onclick="triggerReplacePhoto(${index})" title="Replace this photo" class="px-2.5 py-1.5 rounded-lg bg-white/95 hover:bg-amber-100 text-indigo-950 text-xs font-extrabold shadow-md border border-amber-300 flex items-center gap-1">
                            <i class="fa-solid fa-camera-rotate text-rose-500"></i>
                            <span>Replace</span>
                        </button>
                        <button onclick="openPhotoSpotlight(${index})" title="View full screen" class="w-8 h-8 rounded-lg bg-white/95 hover:bg-sky-100 text-sky-700 text-xs font-bold shadow-md border border-sky-200 flex items-center justify-center">
                            <i class="fa-solid fa-expand"></i>
                        </button>
                        <button onclick="deleteScrapbookPhoto(${index})" title="Remove photo card" class="w-8 h-8 rounded-lg bg-white/95 hover:bg-rose-100 text-rose-600 text-xs font-bold shadow-md border border-rose-200 flex items-center justify-center">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                    
                    <div onclick="${item.isStarter ? `triggerReplacePhoto(${index})` : `openPhotoSpotlight(${index})`}"
                         class="aspect-[4/3] w-full overflow-hidden rounded-xl bg-amber-50 mb-4 shadow-inner relative cursor-pointer">
                        <img src="${item.image}" 
                             onerror="this.onerror=null;this.src='${item.fallback}';" 
                             alt="${item.caption}" 
                             class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        ${item.isStarter ? `
                        <div class="absolute bottom-2 inset-x-2 py-1.5 px-3 rounded-lg bg-white/90 backdrop-blur-sm text-center shadow text-xs font-extrabold text-rose-600 flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-camera"></i>
                            <span>Tap here to put your own photo!</span>
                        </div>
                        ` : ''}
                    </div>

                    <div class="px-1">
                        <p contenteditable="true"
                           onblur="updateScrapbookCaption(${index}, this.textContent)"
                           title="Click to edit caption"
                           class="font-handwriting text-2xl sm:text-3xl font-bold text-indigo-950 leading-tight outline-none focus:bg-amber-100 rounded px-1 cursor-text">
                            ${item.caption}
                        </p>
                        <div class="flex items-center justify-between mt-2 text-xs font-bold text-slate-500 uppercase tracking-wider">
                            <span>${item.date}</span>
                            <span class="text-rose-500 flex items-center gap-1">
                                <i class="fa-solid fa-pen text-[10px] opacity-70"></i>
                                <i class="fa-solid fa-heart"></i>
                            </span>
                        </div>
                    </div>
                `;
                grid.appendChild(polaroid);
            });
        }

        function updateScrapbookCaption(index, newText) {
            const trimmed = newText.trim();
            if (trimmed && state.memories[index]) {
                state.memories[index].caption = trimmed;
            }
        }

        function triggerReplacePhoto(index) {
            replacingPhotoIndex = index;
            document.getElementById('replacePhotoInput').click();
        }

        function handleReplacePhotoUpload(event) {
            const file = event.target.files[0];
            if (!file || replacingPhotoIndex === null) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                if (state.memories[replacingPhotoIndex]) {
                    state.memories[replacingPhotoIndex].image = e.target.result;
                    state.memories[replacingPhotoIndex].isStarter = false;
                    state.memories[replacingPhotoIndex].date = "Favorite Memory";
                    renderScrapbook();
                    triggerConfettiBurst(0.5, 0.5, 70);
                    showToast("Photo updated! Click the caption below it to customize.", "fa-camera-retro");
                }
                replacingPhotoIndex = null;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function deleteScrapbookPhoto(index) {
            if (state.memories.length <= 1) {
                showToast("Keep at least one photo card—you can replace it anytime!", "fa-circle-info");
                return;
            }
            state.memories.splice(index, 1);
            renderScrapbook();
            showToast("Photo card removed.", "fa-trash-can");
        }

        function processUploadedFiles(fileList) {
            const files = Array.from(fileList).filter(f => f.type.startsWith('image/'));
            if (!files.length) return;

            const rotations = ["-rotate-2", "rotate-2", "-rotate-1", "rotate-1"];
            const tapes = ["bg-rose-400/85", "bg-sky-400/85", "bg-emerald-400/85", "bg-fuchsia-400/85"];
            const borders = ["border-rose-300", "border-sky-300", "border-emerald-300", "border-fuchsia-300"];

            let loadedCount = 0;
            files.forEach((file) => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const starterIdx = state.memories.findIndex(m => m.isStarter);
                    if (starterIdx !== -1) {
                        state.memories[starterIdx].image = e.target.result;
                        state.memories[starterIdx].isStarter = false;
                        state.memories[starterIdx].date = "Birthday Memory";
                    } else {
                        const idx = state.memories.length;
                        state.memories.unshift({
                            id: Date.now() + idx,
                            isStarter: false,
                            image: e.target.result,
                            fallback: "https://placehold.co/600x500/FF4D6D/FFFFFF?text=Special+Memory",
                            caption: `Special Birthday Memory #${idx + 1}`,
                            date: "Added Today",
                            rotation: rotations[idx % rotations.length],
                            tapeColor: tapes[idx % tapes.length],
                            borderColor: borders[idx % borders.length]
                        });
                    }

                    loadedCount++;
                    if (loadedCount === files.length) {
                        renderScrapbook();
                        triggerConfettiBurst(0.5, 0.45, 90);
                        document.getElementById('memories-section').scrollIntoView({ behavior: 'smooth', block: 'start' });
                        showToast(`Added ${files.length} photo${files.length > 1 ? 's' : ''} to his scrapbook!`, "fa-images");
                    }
                };
                reader.readAsDataURL(file);
            });
        }

        function handleMultiPhotoUpload(event) {
            processUploadedFiles(event.target.files);
            event.target.value = '';
        }

        function handleDropzoneDragOver(event) {
            event.preventDefault();
            const dz = document.getElementById('heroPhotoDropzone');
            if (dz) dz.classList.add('bg-amber-50', 'border-sky-500', 'scale-[1.01]');
        }

        function handleDropzoneDragLeave(event) {
            event.preventDefault();
            const dz = document.getElementById('heroPhotoDropzone');
            if (dz) dz.classList.remove('bg-amber-50', 'border-sky-500', 'scale-[1.01]');
        }

        function handleDropzoneDrop(event) {
            event.preventDefault();
            const dz = document.getElementById('heroPhotoDropzone');
            if (dz) dz.classList.remove('bg-amber-50', 'border-sky-500', 'scale-[1.01]');
            if (event.dataTransfer && event.dataTransfer.files) {
                processUploadedFiles(event.dataTransfer.files);
            }
        }

        function openPhotoSpotlight(index) {
            if (!state.memories.length) return;
            currentSpotlightIndex = (index + state.memories.length) % state.memories.length;
            updateSpotlightUI();
            const modal = document.getElementById('photoSpotlightModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closePhotoSpotlight() {
            const modal = document.getElementById('photoSpotlightModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function navigateSpotlight(step) {
            currentSpotlightIndex = (currentSpotlightIndex + step + state.memories.length) % state.memories.length;
            updateSpotlightUI();
        }

        function updateSpotlightUI() {
            const item = state.memories[currentSpotlightIndex];
            if (!item) return;
            const img = document.getElementById('spotlightImage');
            img.src = item.image;
            img.onerror = () => { img.src = item.fallback; };
            document.getElementById('spotlightCaption').textContent = item.caption;
            document.getElementById('spotlightCounter').textContent = `Photo ${currentSpotlightIndex + 1} of ${state.memories.length}`;
        }

        /* -----------------------------------------------------------
           6B. EXPORT / DOWNLOAD STANDALONE SHAREABLE HTML FILE
        ----------------------------------------------------------- */
        function downloadShareablePage() {
            try {
                const bakedData = JSON.stringify({
                    ...state,
                    candlesLit: [true, true, true, true, true]
                }).replace(/<\/script>/gi, '<\\/script>');

                const docClone = document.documentElement.cloneNode(true);
                const bakedScript = document.createElement('script');
                bakedScript.textContent = `window.__BAKED_BIRTHDAY_STATE__ = ${bakedData};`;
                docClone.querySelector('head').appendChild(bakedScript);

                const fullHtml = '<!DOCTYPE html>\n' + docClone.outerHTML;
                const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);

                const safeFileName = (state.boyName || 'Birthday')
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/(^-|-$)/g, '') || 'birthday-celebration';

                const link = document.createElement('a');
                link.href = url;
                link.download = `happy-birthday-${safeFileName}.html`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);

                triggerConfettiBurst(0.5, 0.5, 90);
                showToast("Downloaded your customized birthday webpage!", "fa-file-arrow-down");
            } catch (err) {
                showToast("Could not generate download in this preview window.", "fa-circle-exclamation");
            }
        }

        /* -----------------------------------------------------------
           7. FLOATING BALLOONS
        ----------------------------------------------------------- */
        function spawnBalloon() {
            const container = document.getElementById('balloonContainer');
            if (!container) return;

            const colors = [
                'from-rose-400 to-pink-600',
                'from-sky-400 to-blue-600',
                'from-amber-300 to-orange-500',
                'from-emerald-400 to-teal-600',
                'from-fuchsia-400 to-purple-600'
            ];
            const colorClass = colors[Math.floor(Math.random() * colors.length)];
            const leftPct = 8 + Math.random() * 84;
            const duration = 9 + Math.random() * 5;

            const balloon = document.createElement('div');
            balloon.className = "floating-balloon flex flex-col items-center";
            balloon.style.left = `${leftPct}%`;
            balloon.style.animation = `balloonFloatUp ${duration}s linear forwards`;

            balloon.innerHTML = `
                <div class="w-12 h-14 sm:w-14 sm:h-16 rounded-full bg-gradient-to-br ${colorClass} shadow-lg relative flex items-center justify-center border border-white/40">
                    <div class="w-3 h-5 rounded-full bg-white/35 -translate-x-2 -translate-y-2 rotate-12"></div>
                </div>
                <div class="w-0 h-0 border-l-[5px] border-l-transparent border-r-[5px] border-r-transparent border-b-[7px] border-b-amber-400 -mt-0.5"></div>
                <div class="w-px h-10 bg-slate-400/70"></div>
            `;

            balloon.onclick = function(e) {
                e.stopPropagation();
                const rect = balloon.getBoundingClientRect();
                const xNorm = (rect.left + rect.width / 2) / window.innerWidth;
                const yNorm = (rect.top + rect.height / 2) / window.innerHeight;
                playPopSound();
                triggerConfettiBurst(xNorm, yNorm, 35);
                balloon.remove();
            };

            container.appendChild(balloon);
            setTimeout(() => {
                if (balloon.parentNode) balloon.remove();
            }, duration * 1000 + 200);
        }

        /* -----------------------------------------------------------
           8. CONFETTI & FIREWORKS CANVAS
        ----------------------------------------------------------- */
        const canvas = document.getElementById('celebrationCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function triggerConfettiBurst(xRatio = 0.5, yRatio = 0.4, count = 80) {
            const colors = ['#ff4d6d', '#ff9e00', '#facc15', '#10b981', '#00d4ff', '#a855f7'];
            const originX = canvas.width * xRatio;
            const originY = canvas.height * yRatio;

            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 8;
                particles.push({
                    x: originX,
                    y: originY,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed - 2.5,
                    size: 6 + Math.random() * 7,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    shape: Math.random() > 0.45 ? 'rect' : 'circle',
                    rotation: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 10,
                    drag: 0.985,
                    gravity: 0.16,
                    alpha: 1
                });
            }
        }

        function animateCelebrationCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.vx *= p.drag;
                p.vy *= p.drag;
                p.vy += p.gravity;
                p.x += p.vx;
                p.y += p.vy;
                p.rotation += p.rotSpeed;
                p.alpha -= 0.011;

                if (p.alpha <= 0) {
                    particles.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.translate(p.x, p.y);
                ctx.rotate((p.rotation * Math.PI) / 180);
                ctx.fillStyle = p.color;

                if (p.shape === 'rect') {
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
                } else {
                    ctx.beginPath();
                    ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            requestAnimationFrame(animateCelebrationCanvas);
        }

        /* -----------------------------------------------------------
           9. WEB AUDIO API SYNTHESIZER ("HAPPY BIRTHDAY" & SFX)
        ----------------------------------------------------------- */
        let audioCtx = null;
        let isPlayingMelody = false;
        let melodyTimeouts = [];

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playTone(freq, startTime, duration, volume = 0.16) {
            const ctx = getAudioContext();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, startTime);

            gain.gain.setValueAtTime(0.001, startTime);
            gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.04);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(startTime);
            osc.stop(startTime + duration + 0.05);
        }

        function toggleBirthdayMusic() {
            const btnText = document.getElementById('musicBtnText');
            const icon = document.getElementById('musicIcon');

            if (isPlayingMelody) {
                isPlayingMelody = false;
                melodyTimeouts.forEach(id => clearTimeout(id));
                melodyTimeouts = [];
                if (btnText) btnText.textContent = "Play Melody";
                if (icon) icon.className = "fa-solid fa-music";
                return;
            }

            isPlayingMelody = true;
            if (btnText) btnText.textContent = "Playing...";
            if (icon) icon.className = "fa-solid fa-volume-high animate-pulse";

            const ctx = getAudioContext();
            const now = ctx.currentTime + 0.05;

            const notes = [
                { f: 261.63, t: 0.0, d: 0.35 },
                { f: 261.63, t: 0.4, d: 0.35 },
                { f: 293.66, t: 0.8, d: 0.7 },
                { f: 261.63, t: 1.6, d: 0.7 },
                { f: 349.23, t: 2.4, d: 0.7 },
                { f: 329.63, t: 3.2, d: 1.3 },

                { f: 261.63, t: 4.8, d: 0.35 },
                { f: 261.63, t: 5.2, d: 0.35 },
                { f: 293.66, t: 5.6, d: 0.7 },
                { f: 261.63, t: 6.4, d: 0.7 },
                { f: 392.00, t: 7.2, d: 0.7 },
                { f: 349.23, t: 8.0, d: 1.3 },

                { f: 261.63, t: 9.6, d: 0.35 },
                { f: 261.63, t: 10.0, d: 0.35 },
                { f: 523.25, t: 10.4, d: 0.7 },
                { f: 440.00, t: 11.2, d: 0.7 },
                { f: 349.23, t: 12.0, d: 0.7 },
                { f: 329.63, t: 12.8, d: 0.7 },
                { f: 293.66, t: 13.6, d: 1.2 },

                { f: 466.16, t: 15.1, d: 0.35 },
                { f: 466.16, t: 15.5, d: 0.35 },
                { f: 440.00, t: 15.9, d: 0.7 },
                { f: 349.23, t: 16.7, d: 0.7 },
                { f: 392.00, t: 17.5, d: 0.7 },
                { f: 349.23, t: 18.3, d: 1.5 }
            ];

            notes.forEach(n => {
                playTone(n.f, now + n.t, n.d, 0.18);
            });

            const finishTimer = setTimeout(() => {
                isPlayingMelody = false;
                if (btnText) btnText.textContent = "Play Melody";
                if (icon) icon.className = "fa-solid fa-music";
            }, 20000);
            melodyTimeouts.push(finishTimer);
        }

        function playPopSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(520, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.09);
            } catch (e) {}
        }

        function playSoftPuffSound() {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(220, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.12, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.16);
            } catch (e) {}
        }

        function playCelebrationChord() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                    playTone(freq, now + idx * 0.07, 0.9, 0.12);
                });
            } catch (e) {}
        }

        /* -----------------------------------------------------------
           10. INITIALIZATION ON PAGE LOAD
        ----------------------------------------------------------- */
        window.addEventListener('DOMContentLoaded', () => {
            syncPersonalizationUI();
            renderCandles();
            renderAmazingCards();
            renderScrapbook();
            animateCelebrationCanvas();

            setTimeout(() => triggerConfettiBurst(0.5, 0.35, 110), 400);

            for (let i = 0; i < 5; i++) {
                setTimeout(spawnBalloon, i * 1200);
            }
            setInterval(spawnBalloon, 2800);
        });
    </script>
